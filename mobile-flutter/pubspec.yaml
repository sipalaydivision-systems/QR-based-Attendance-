publish_to: 'none'
version: 2.1.47+78

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.4
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.0
  url_launcher: ^6.3.2

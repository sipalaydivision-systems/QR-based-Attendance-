name: Publish APK Releases

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-apk-releases.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish current Android installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          publish_apk() {
            local tag="$1"
            local title="$2"
            local source_file="$3"
            local asset_name="$4"

            test -s "$source_file"
            cp "$source_file" "$RUNNER_TEMP/$asset_name"
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" --target "$GITHUB_SHA" \
                --title "$title" \
                --notes "Official EduTrack Android installer."
            fi
            gh release upload "$tag" "$RUNNER_TEMP/$asset_name" --clobber
          }

          mobile_version="$(awk '/^version:/ {print $2}' mobile-flutter/pubspec.yaml | cut -d+ -f1)"
          guardian_version="$(awk '/^version:/ {print $2}' mobile-flutter-parent/pubspec.yaml | cut -d+ -f1)"

          publish_apk \
            "mobile-v${mobile_version}" \
            "EduTrack Mobile ${mobile_version}" \
            "public/downloads/school-attendance-division.apk" \
            "EduTrack-Mobile-${mobile_version}.apk"

          publish_apk \
            "guardian-v${guardian_version}" \
            "EduTrack Guardian ${guardian_version}" \
            "public/downloads/edutrack-parent.apk" \
            "EduTrack-Guardian-${guardian_version}.apk"

name: Build Flutter APK

on:
  push:
    branches:
      - main
    paths:
      - 'mobile-flutter/lib/**'
      - 'mobile-flutter/pubspec.yaml'
      - 'mobile-flutter/pubspec.lock'
      - 'mobile-flutter/android/**'
  workflow_dispatch:

concurrency:
  group: build-flutter-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # No pinned version: pubspec requires Dart ^3.11.5, so use latest stable

      - name: Install Flutter dependencies
        working-directory: mobile-flutter
        run: flutter pub get

      - name: Build release APK
        working-directory: mobile-flutter
        run: |
          set +e
          flutter build apk --release 2>&1 | tee mobile-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            message="$(tail -n 80 mobile-build.log)"
            message="${message//'%'/'%25'}"
            message="${message//$'\n'/'%0A'}"
            message="${message//$'\r'/'%0D'}"
            echo "::error title=EduTrack mobile APK build failed::$message"
          fi
          exit "$status"

      - name: Copy APK to public/downloads
        run: |
          cp mobile-flutter/build/app/outputs/flutter-apk/app-release.apk \
             public/downloads/school-attendance-division.apk
          echo "APK size: $(du -sh public/downloads/school-attendance-division.apk)"

      - name: Commit and push updated APK
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/downloads/school-attendance-division.apk
          if git diff --staged --quiet; then
            echo "No changes to APK — skipping commit."
          else
            git commit -m "chore: auto-rebuild Flutter APK [skip ci]"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "APK updated and pushed."
                break
              fi
              echo "Push rejected (attempt $i) — rebasing on latest main and retrying..."
              git pull --rebase origin main || git rebase --abort
              sleep 3
            done
          fi

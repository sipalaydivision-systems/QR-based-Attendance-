name: Build Desktop Installer

on:
  push:
    branches:
      - main
    paths:
      - 'desktop-scanner/src/**'
      - 'desktop-scanner/package.json'
      - 'desktop-scanner/package-lock.json'
  workflow_dispatch:

# Prevent infinite loop — ignore commits that only update the installer binary
concurrency:
  group: build-desktop-installer
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: desktop-scanner/package-lock.json

      - name: Install dependencies
        working-directory: desktop-scanner
        run: npm ci

      - name: Build Windows installer
        working-directory: desktop-scanner
        run: npm run dist

      - name: Copy installer to public/downloads
        shell: pwsh
        run: |
          Copy-Item "desktop-scanner\dist\Edutrack-Scanner-Setup-*.exe" `
            -Destination "public\downloads\Edutrack-Scanner-Setup.exe" `
            -Force
          Write-Host "Installer size: $((Get-Item 'public\downloads\Edutrack-Scanner-Setup.exe').Length) bytes"

      - name: Publish versioned installer to GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content 'desktop-scanner\package.json' | ConvertFrom-Json).version
          $tag = "desktop-v$version"
          $asset = "Edutrack-Scanner-Setup-$version.exe"
          Copy-Item 'public\downloads\Edutrack-Scanner-Setup.exe' $asset -Force
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $asset --title "EduTrack Scanner $version" --notes "Optimized background data use with responsive remote controls and unchanged attendance scanning."
          } else {
            gh release upload $tag $asset --clobber
          }

      - name: Commit and push updated installer
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/downloads/Edutrack-Scanner-Setup.exe
          $status = git status --porcelain
          if ($status) {
            git commit -m "chore: auto-rebuild desktop installer [skip ci]"
            $pushed = $false
            for ($i = 1; $i -le 5; $i++) {
              git push
              if ($LASTEXITCODE -eq 0) {
                $pushed = $true
                Write-Host "Installer updated and pushed."
                break
              }
              Write-Host "Push rejected (attempt $i) — rebasing on latest main and retrying..."
              git pull --rebase origin main
              if ($LASTEXITCODE -ne 0) { git rebase --abort }
              Start-Sleep -Seconds 3
            }
            if (-not $pushed) {
              Write-Host "::error title=Installer publish failed::Could not push the rebuilt installer after 5 attempts."
              exit 1
            }
          } else {
            Write-Host "No changes to installer — skipping commit."
          }

name: Build Mobile APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - public/downloads/school-attendance-division.apk
      - public/downloads/.gitkeep
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-react-native-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install React Native dependencies
        working-directory: mobile-react-native
        run: npm install --legacy-peer-deps

      - name: Generate Android project
        working-directory: mobile-react-native
        env:
          EXPO_PUBLIC_API_BASE_URL: https://school-attendance-qrbased.up.railway.app
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build installable debug APK
        working-directory: mobile-react-native/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish APK into web download folder
        run: |
          cp mobile-react-native/android/app/build/outputs/apk/debug/app-debug.apk public/downloads/school-attendance-division.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/school-attendance-division.apk
          if git diff --cached --quiet; then
            echo "APK did not change."
          else
            git commit -m "Update mobile APK from React Native build"
            git push
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: school-attendance-division-apk
          path: public/downloads/school-attendance-division.apk

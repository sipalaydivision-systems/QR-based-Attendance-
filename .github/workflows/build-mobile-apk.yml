name: Publish Mobile APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - public/downloads/school-attendance-division.apk
      - public/downloads/.gitkeep
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify committed Flutter APK
        run: |
          test -s public/downloads/school-attendance-division.apk
          echo "Using committed Flutter release APK for the Railway /mobile-app download."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: school-attendance-division-apk
          path: public/downloads/school-attendance-division.apk

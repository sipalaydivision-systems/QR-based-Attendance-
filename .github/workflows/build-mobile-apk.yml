name: Build Mobile APK

on:
  push:
    branches:
      - main
    paths:
      - "mobile-sds-asds-android/**"
      - "public/mobile-config.json"
      - ".github/workflows/build-mobile-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Configure attendance server
        env:
          MOBILE_APP_BASE_URL: ${{ vars.MOBILE_APP_BASE_URL }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const xmlPath = 'mobile-sds-asds-android/app/src/main/res/values/strings.xml';
          const configPath = 'public/mobile-config.json';
          const configured = (process.env.MOBILE_APP_BASE_URL || '').trim().replace(/\/+$/, '');
          let config = { base_url: '', fallback_urls: [] };
          if (fs.existsSync(configPath)) {
            try { config = { ...config, ...JSON.parse(fs.readFileSync(configPath, 'utf8')) }; } catch (_) {}
          }
          if (configured) config.base_url = configured;
          fs.writeFileSync(configPath, JSON.stringify(config, null, 2) + '\n');
          const baseUrl = (config.base_url || '').replace(/[<>&]/g, c => ({
            '<': '&lt;',
            '>': '&gt;',
            '&': '&amp;'
          }[c]));
          let xml = fs.readFileSync(xmlPath, 'utf8');
          xml = xml.replace(/<string name="base_url">[\s\S]*?<\/string>/, `<string name="base_url">${baseUrl}</string>`);
          fs.writeFileSync(xmlPath, xml);
          NODE

      - name: Build debug APK
        run: gradle -p mobile-sds-asds-android assembleDebug

      - name: Publish APK into web downloads
        run: |
          mkdir -p public/downloads
          cp mobile-sds-asds-android/app/build/outputs/apk/debug/app-debug.apk public/downloads/school-attendance-division.apk

      - name: Commit APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/school-attendance-division.apk public/mobile-config.json mobile-sds-asds-android/app/src/main/res/values/strings.xml
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publish mobile APK"
            git push
          fi

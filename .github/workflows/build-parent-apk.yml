name: Build Parent APK

on:
  push:
    branches:
      - main
    paths:
      - 'mobile-flutter-parent/lib/**'
      - 'mobile-flutter-parent/pubspec.yaml'
      - 'mobile-flutter-parent/android/**'
  workflow_dispatch:

concurrency:
  group: build-parent-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # No pinned version: pubspec requires Dart ^3.11.5, so use latest stable

      - name: Install Flutter dependencies
        working-directory: mobile-flutter-parent
        run: flutter pub get

      - name: Analyze (non-blocking)
        working-directory: mobile-flutter-parent
        run: flutter analyze || true

      - name: Build release APK
        working-directory: mobile-flutter-parent
        run: |
          set +e
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee parent-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            message="$(tail -n 80 parent-build.log)"
            message="${message//'%'/'%25'}"
            message="${message//$'\n'/'%0A'}"
            message="${message//$'\r'/'%0D'}"
            echo "::error title=Parent APK build failed::$message"
          fi
          exit "$status"

      - name: Copy APK to public/downloads
        run: |
          mkdir -p public/downloads
          cp mobile-flutter-parent/build/app/outputs/flutter-apk/app-release.apk \
             public/downloads/edutrack-parent.apk
          echo "APK size: $(du -sh public/downloads/edutrack-parent.apk)"

      - name: Publish Guardian APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(awk '/^version:/ {print $2}' mobile-flutter-parent/pubspec.yaml | cut -d+ -f1)"
          tag="guardian-v${version}"
          asset="EduTrack-Guardian-${version}.apk"
          cp public/downloads/edutrack-parent.apk "$RUNNER_TEMP/$asset"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" \
              --title "EduTrack Guardian ${version}" \
              --notes "Official EduTrack Guardian Android installer."
          fi
          gh release upload "$tag" "$RUNNER_TEMP/$asset" --clobber

      - name: Commit and push updated APK
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/downloads/edutrack-parent.apk
          if git diff --staged --quiet; then
            echo "No changes to APK — skipping commit."
          else
            git commit -m "chore: auto-rebuild Parent APK [skip ci]"
            pushed=0
            for i in 1 2 3 4 5; do
              if git push; then
                pushed=1
                echo "Parent APK updated and pushed."
                break
              fi
              echo "Push rejected (attempt $i) — rebasing on latest main and retrying..."
              git pull --rebase origin main || git rebase --abort
              sleep 3
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error title=Parent APK publish failed::Could not push the rebuilt APK after 5 attempts."
              exit 1
            fi
          fi
